name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      # Builds the Chrome version too, so a broken manifest or icon step fails here.
      - run: npm run zip:chrome
      - uses: actions/upload-artifact@v4
        with:
          name: smart-group-chrome
          path: dist/smart-group-chrome-*.zip
