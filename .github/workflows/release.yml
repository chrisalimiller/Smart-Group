# Submits the extension to the Firefox Add-ons store (addons.mozilla.org) for review,
# then makes a GitHub release with the notes. Mozilla signs and publishes it once approved.
# Needs two repository secrets from https://addons.mozilla.org/developers/addon/api/key/ :
#   AMO_JWT_ISSUER and AMO_JWT_SECRET
# To release: bump "version" in src/manifest.json, then push a tag like v0.1.0.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the tag matches the manifest version
        run: |
          v=$(node -p "require('./src/manifest.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match manifest version $v"; exit 1; }
      - name: Submit to the Firefox Add-ons store
        # Store review can take days, so don't wait for it. amo-metadata.json holds the
        # store listing details Mozilla needs for the first submission.
        run: >
          npx web-ext sign --source-dir src --channel listed --amo-metadata amo-metadata.json
          --approval-timeout 0 --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      - name: Publish release notes
        run: gh release create "$GITHUB_REF_NAME" --title "Smart Group $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
